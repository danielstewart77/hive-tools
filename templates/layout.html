<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HiveTools{% endblock %}</title>
    {% block head %}{% endblock %}
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --bg: #f0f2f5;
            --surface: #ffffff;
            --nav-bg: #1e1e2e;
            --nav-text: #cdd6f4;
            --nav-active: #89b4fa;
            --accent: #89b4fa;
            --accent-hover: #74c7ec;
            --text: #1e1e2e;
            --muted: #6c7086;
            --border: #e2e8f0;
            --shadow: 0 1px 4px rgba(0,0,0,0.08);
            --badge-off: #6c7086;
            --badge-on: #fe640b;
            --badge-sudo: #d20f39;
            --radius: 8px;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
        }

        nav {
            background: var(--nav-bg);
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 4px;
            height: 52px;
        }

        nav .brand {
            color: var(--nav-active);
            font-weight: 700;
            font-size: 16px;
            margin-right: 24px;
            letter-spacing: 0.5px;
        }

        nav a {
            color: var(--nav-text);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            transition: background 0.15s, color 0.15s;
            font-size: 13px;
        }

        nav a:hover { background: rgba(255,255,255,0.08); color: #fff; }
        nav a.active { color: var(--nav-active); background: rgba(137,180,250,0.12); }

        .container { max-width: 1000px; margin: 0 auto; padding: 28px 20px; }

        h1 { font-size: 20px; font-weight: 700; margin: 0 0 20px; color: var(--text); }
        h2 { font-size: 15px; font-weight: 600; margin: 0; }

        /* Cards */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }

        .card-header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            border-radius: var(--radius);
        }

        .card-header::-webkit-details-marker { display: none; }

        details[open] .card-header {
            border-bottom: 1px solid var(--border);
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .card-header .chevron {
            margin-left: auto;
            color: var(--muted);
            transition: transform 0.2s;
            font-size: 12px;
        }

        details[open] .card-header .chevron { transform: rotate(180deg); }

        .card-body { padding: 0; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; }
        th { padding: 9px 16px; text-align: left; font-size: 11px; font-weight: 600;
             text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted);
             background: #fafafa; border-bottom: 1px solid var(--border); }
        td { padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafbff; }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: white;
        }
        .badge-off  { background: var(--badge-off); }
        .badge-on   { background: var(--badge-on); }
        .badge-sudo { background: var(--badge-sudo); }

        /* Buttons */
        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: var(--accent); color: #1e1e2e; }
        .btn-danger  { background: var(--badge-sudo); color: white; }
        .btn-success { background: #40a02b; color: white; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .notice {
            padding: 12px 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent);
            background: rgba(255, 255, 255, 0.06);
        }

        /* Form elements */
        select, input[type="number"], input[type="text"], input[type="password"] {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            background: var(--surface);
            color: var(--text);
        }
        select:focus, input:focus { outline: 2px solid var(--accent); border-color: transparent; }

        .group-count {
            background: #e8edf5;
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* HTTP method badges */
        .method-badge {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.4px;
            font-family: monospace;
            min-width: 46px;
            text-align: center;
        }
        .method-GET    { background: #dff0d8; color: #3c763d; }
        .method-POST   { background: #dce8fb; color: #1a56a0; }
        .method-PATCH  { background: #fdf3d0; color: #8a6d3b; }
        .method-DELETE { background: #fde8e8; color: #a94442; }

        /* 3-position mode toggle */
        .mode-toggle {
            display: inline-flex;
            background: #ebebf0;
            border-radius: 7px;
            padding: 3px;
            gap: 2px;
        }
        .mode-toggle input[type="radio"] { display: none; }
        .mode-toggle label {
            padding: 4px 11px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            color: var(--muted);
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }
        .mode-toggle input[value="off"]:checked  + label { background: #6c7086; color: white; }
        .mode-toggle input[value="on"]:checked   + label { background: #fe640b; color: white; }
        .mode-toggle input[value="sudo"]:checked + label { background: #d20f39; color: white; }

        .sudo-timeout-field {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--muted);
        }
        .sudo-timeout-field.visible { display: flex; }
    </style>
</head>
<body>
    {% block nav %}
    <nav>
        <span class="brand">&#9729; HiveTools</span>
        <a href="/">Dashboard</a>
        <a href="/tools">Tools</a>
        <a href="/tokens">Tokens</a>
        <a href="/hitl-ui">Approvals</a>
    </nav>
    {% endblock %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
